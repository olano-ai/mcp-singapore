name: Bootstrap v0.2.0 release

on:
  push:
    branches:
      - 'feat/expand-singapore-suite'

concurrency:
  group: bootstrap-v0.2.0-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'olano-ai/mcp-singapore'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - name: Create or validate v0.2.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 74aec256a2beb851c886eaec91d2694d37f01fc8
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$TARGET_SHA"
          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.2.0" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$TARGET_SHA"
            echo 'v0.2.0 already points at the expected main commit.'
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v0.2.0' -f sha="$TARGET_SHA"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 74aec256a2beb851c886eaec91d2694d37f01fc8
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing npm client
        run: npm install --global 'npm@11.9.0'

      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: npx vitest run
      - run: node scripts/check-parity.mjs
      - run: RELEASE_TAG=v0.2.0 node scripts/check-release.mjs
      - run: node scripts/verify-packages.mjs

      - name: Publish packages in dependency order
        run: node scripts/publish-workspaces.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install the pinned MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          archive=/tmp/mcp-publisher.tar.gz
          curl --fail --location --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp mcp-publisher
          sudo install --mode 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help >/dev/null

      - name: Publish official MCP Registry metadata
        env:
          MCP_REGISTRY_SERVER_PATH: io.github.olano-ai%2Fmcp-singapore
        run: |
          detail_url="https://registry.modelcontextprotocol.io/v0.1/servers/${MCP_REGISTRY_SERVER_PATH}/versions/0.2.0"
          if curl --fail --silent --show-error "$detail_url" >/dev/null; then
            echo 'MCP Registry version already published; skipping.'
            exit 0
          fi
          mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            if mcp-publisher publish; then
              exit 0
            fi
            if curl --fail --silent "$detail_url" >/dev/null; then
              echo 'MCP Registry version is now available.'
              exit 0
            fi
            sleep "$((attempt * 10))"
          done
          echo 'MCP Registry publish failed after five attempts.' >&2
          exit 1

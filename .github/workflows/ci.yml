name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: npx vitest run

      - name: Validate release metadata
        if: matrix.node-version == 22
        run: RELEASE_TAG="v$(node -p "require('./package.json').version")" node scripts/check-release.mjs

      - name: Verify package contents
        if: matrix.node-version == 22
        run: node scripts/verify-packages.mjs

      - name: Verify capability coverage contract
        if: matrix.node-version == 22
        run: node scripts/check-capability-coverage.mjs

      - name: Validate Claude Code plugins
        if: matrix.node-version == 22
        run: npm run check:plugins

      - name: Run official Claude Code plugin validator
        if: matrix.node-version == 22
        run: |
          validator='@anthropic-ai/claude-code@2.1.237'
          npm exec --yes --package="$validator" -- claude plugin validate .
          for plugin in plugins/*; do
            npm exec --yes --package="$validator" -- claude plugin validate "$plugin"
          done

      - name: Check workflow security invariants
        if: matrix.node-version == 22
        run: npm run check:workflows

      - name: Audit dependencies
        if: matrix.node-version == 22
        run: npm audit --audit-level=high

      - name: Verify generated brand assets are committed
        if: matrix.node-version == 22
        run: npm run check:brand

      - name: Build the Claude Desktop bundle
        if: matrix.node-version == 22
        run: npm run build:mcpb

      - name: Verify the Claude Desktop bundle starts and serves tools
        if: matrix.node-version == 22
        run: npm run check:mcpb

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build container
        run: docker build --tag olano-mcp-singapore:ci .
      - name: Start container
        run: docker run --detach --name olano-mcp-singapore --publish 3000:3000 olano-mcp-singapore:ci
      - name: Verify Streamable HTTP server
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output response.json --write-out '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [ "$status" = '404' ] && grep --quiet 'MCP endpoint: /mcp' response.json; then
              exit 0
            fi
            sleep 1
          done
          docker logs olano-mcp-singapore
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force olano-mcp-singapore
